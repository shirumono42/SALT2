{% extends "base.html" %}
{% block title %}ログイン｜名刺管理{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px;margin:48px auto">
  <h1>ログイン</h1>
  <form method="post" action="/login">
    <label for="email">メールアドレス</label>
    <input id="email" type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus>
    <label for="password">パスワード</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <p><button type="submit">ログイン</button></p>
  </form>
  <p class="hint">初めての方は、管理者から届いたコードで<a href="/activate">アカウントを有効化</a>してください。</p>
</div>
{% endblock %}
